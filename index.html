<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>md_blog</title>
    <!-- 引入marked.js库用于解析Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 简单的样式美化，让Markdown内容更易读 */
        .markdown-content {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            line-height: 1.6;
            font-size: 16px;
        }
        h1, h2, h3 {
            margin-top: 24px;
            margin-bottom: 16px;
        }
        p {
            margin-bottom: 16px;
        }
        pre {
            background-color: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
        }
        code {
            background-color: #f6f8fa;
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- 用于触发加载Markdown的按钮/链接 -->
    <button onclick="loadMarkdown()">加载笔记</button>
    <!-- 用于展示渲染后的Markdown内容 -->
    <div class="markdown-content" id="markdown-container"></div>

    <script>
        // 加载并渲染Markdown文件的函数
        async function loadMarkdown() {
            try {
                // 1. 读取本地的notes.md文件
                const response = await fetch('./notes.md');
                
                // 检查请求是否成功
                if (!response.ok) {
                    throw new Error(`无法加载文件: ${response.status} ${response.statusText}`);
                }

                // 2. 获取文件的文本内容
                const markdownText = await response.text();

                // 3. 使用marked.js解析Markdown为HTML
                const htmlContent = marked.parse(markdownText);

                // 4. 将解析后的HTML插入到页面中
                document.getElementById('markdown-container').innerHTML = htmlContent;

            } catch (error) {
                // 处理错误（比如文件不存在）
                document.getElementById('markdown-container').innerHTML = 
                    `<p style="color: red;">加载失败: ${error.message}</p>`;
                console.error('加载Markdown出错:', error);
            }
        }
    </script>
</body>
</html>
