<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>md_blog</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!--  -->
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .box{
        display: flex;
        flex-direction: row;
    }
    .nav{
        height: 100%;
        width: 200px;
        position: fixed;
        top: 0;
        left: 0;
        border: 1px solid #eaecef;
        background-color: #f5fafa;
    }
    .nav .title{
        text-align: center;
        text-align: center;
        background-color: #b4f6f8;
    }
    .nav .title span{
        font-size: 20px;
        line-height: 50px;
    }
    .nav .list{
        max-height: 100vh;/* 最大高度 */
        overflow-y: auto;/* 垂直滚动条 */
        /* margin-top: 30px; */
    }
    .nav .list::-webkit-scrollbar{
        display: none;
    }
    .nav .list a{
        display: block;
        line-height: 40px;
        font-size: 20px;
        text-align: center;
        text-decoration: none;
        color: black;
        /* border: 1px solid red; */
    }
    .file-item:hover {
        background-color: #f1e0e0;
    }
    /* markdown-content */
    .markdown-content {
        /* max-width: 80%; */
        width: 100%;
        margin-left: 200px;
        padding: 0 20px;
        line-height: 1.6;
        font-size: 16px;
        /* background-color: #e4bbbb; */
    }
    h1, h2, h3 {
        margin-top: 24px;
        margin-bottom: 16px;
    }
    p {
        margin-bottom: 16px;
    }
    pre {
        background-color: #f6f8fa;
        padding: 16px;
        border-radius: 6px;
        overflow-x: auto;
    }
    code {
        background-color: #f6f8fa;
        padding: 2px 4px;
        border-radius: 3px;
    }
    .error {
        color: red;
    }
</style>
<body>
    <div class="box" >
        <div class="nav">
            <div class="title">
                <span>文件列表</span>
            </div>
            <div class="list" class="file-list">
                <a href="#" id="file-list-container">笔记</a>
            </div>
        </div>
        <div class="markdown-content" id="markdown-container"></div>
    </div>
</body>
<script>
    // 1. 预定义 md 文件夹下的所有 Markdown 文件（手动维护）
    const mdFiles = [
        'notes.md',
        'work.md'
        // 新增文件时，在这里添加即可
    ];

    // 2. 定义默认加载的文件（解决 filename 未定义问题）
    const DEFAULT_FILE = mdFiles[0] || '';

    // 3. 页面加载时渲染文件列表 + 加载默认文件
    window.onload = function() {
        renderFileList();
        loadMarkdownFile(DEFAULT_FILE); // 使用默认文件，而非未定义的 filename
    };

    // 渲染文件列表
    function renderFileList() {
        const listContainer = document.getElementById('file-list-container');
        if (mdFiles.length === 0) {
            listContainer.innerHTML = '<p>暂无 Markdown 文件</p>';
            return;
        }

        // 为每个文件生成可点击的条目
        const fileItems = mdFiles.map(file => 
            `<div class="file-item" onclick="loadMarkdownFile('${file}')">${file}</div>`
        ).join('');
        
        listContainer.innerHTML = fileItems;
    }

    // 加载并渲染指定的 Markdown 文件
    async function loadMarkdownFile(filename) {
        const container = document.getElementById('markdown-container');
        try {
            // 拼接文件路径（md 文件夹下）
            const response = await fetch(`./md/${filename}`);
            
            if (!response.ok) {
                throw new Error(`文件加载失败: ${response.status}`);
            }

            const markdownText = await response.text();
            const htmlContent = marked.parse(markdownText);
            container.innerHTML = htmlContent;

        } catch (error) {
            container.innerHTML = `<p class="error">加载 ${filename} 失败: ${error.message}</p>`;
            console.error('加载错误:', error);
        }
    }
</script>
</html>
